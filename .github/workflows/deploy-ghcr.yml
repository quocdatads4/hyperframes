name: Build HyperFrames image

on:
  push:
    branches:
      - main
    paths:
      - "packages/**"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - ".dockerignore"
      - ".github/workflows/deploy-ghcr.yml"
  workflow_dispatch:

concurrency:
  group: hyperframes-production-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      REGISTRY: ghcr.io
      APP_IMAGE: ghcr.io/quocdatads4/hyperframes

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          lfs: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          echo "sha_tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build and push HyperFrames image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./packages/gcp-cloud-run/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.APP_IMAGE }}:main
            ${{ env.APP_IMAGE }}:${{ steps.version.outputs.sha_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.sha_tag }}
          cache-from: type=registry,ref=${{ env.APP_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.APP_IMAGE }}:buildcache,mode=max
          provenance: mode=max

      - name: Verify published image
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools inspect \
            "${APP_IMAGE}:${{ steps.version.outputs.sha_tag }}"

      - name: Trigger Dokploy deployment
        env:
          DOKPLOY_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$DOKPLOY_DEPLOY_WEBHOOK" ]; then
            echo "DOKPLOY_DEPLOY_WEBHOOK is not configured; image publication completed without deployment."
            exit 0
          fi

          deploy_payload="$(
            jq -n \
              --arg ref "refs/heads/${GITHUB_REF_NAME}" \
              --arg sha "$GITHUB_SHA" \
              --arg message "Deploy ${GITHUB_SHA::12} after GHCR publish" \
              '{
                ref: $ref,
                commits: [{ modified: [".dokploy/manual-deploy-only"] }],
                head_commit: {
                  id: $sha,
                  message: $message
                }
              }'
          )"

          curl --fail-with-body --silent --show-error \
            --max-time 30 \
            --header "Content-Type: application/json" \
            --header "X-GitHub-Event: push" \
            --request POST \
            --data "$deploy_payload" \
            "$DOKPLOY_DEPLOY_WEBHOOK"
